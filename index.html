<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E3EAF3">
  <title>Crew</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    try {
      if (sessionStorage.getItem('crew-pulse-auth') === '1') {
        document.documentElement.classList.add('unlocked');
      }
    } catch (e) {}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="frame">
      <div class="brand">
        <h1>Crew</h1>
        <span id="global-dot" class="dot idle" aria-hidden="true"></span>
        <div class="lock-wrap" id="lock-wrap">
          <button type="button" id="lock-btn" class="lock" aria-label="进入" aria-expanded="false" aria-controls="gate-form">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <rect x="3.2" y="7" width="9.6" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5.2 7V5.1a2.8 2.8 0 0 1 5.6 0V7" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
          <form id="gate-form" class="popover" hidden>
            <input id="gate-input" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="进入">
            <p id="gate-error" class="gate-error">未通过</p>
            <button type="submit" class="sr">进入</button>
          </form>
        </div>
      </div>
      <div id="kpis" class="kpis"></div>
      </div>
    </header>
    <div class="body">
      <nav id="side" class="side" aria-label="Crew"></nav>
      <div class="main">
        <div id="chips" class="chips"></div>
        <div id="cards" class="cards"></div>
        <section id="timeline" class="timeline"></section>
      </div>
    </div>
  </div>
  <noscript><p class="noscript">需要脚本才能阅读。</p></noscript>
  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="config/site.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
